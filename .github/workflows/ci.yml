# PR 검증용. main 으로 가는 PR 마다 lint/test + 도커 빌드 확인.
# 이미지 push 는 안 한다(빌드가 깨지는지만 본다).
name: ci

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - run: go test ./...

      # 이미지가 실제로 빌드되는지만 확인 (push=false)
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build/package/Dockerfile
          push: false
